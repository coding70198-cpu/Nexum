                            <p className="text-xs text-white/50 mt-0.5">Instructor: Dr. K.C. Anita</p>
                          </div>
                          <button onClick={() => alert('Class reminder set!')} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs text-white">Set Reminder</button>
                        </div>

                        <div className="bg-white/5 border border-white/10 rounded-2xl p-5 flex justify-between items-center">
                          <div>
                            <span className="text-xs text-white/40 font-semibold">RECORDED • Yesterday</span>
                            <h4 className="text-base font-semibold text-white mt-1">Full Chapter 4 & 5 Video Lecture</h4>
                            <p className="text-xs text-white/50 mt-0.5">Duration: 1h 24m • HD Quality</p>
                          </div>
                          <button onClick={() => alert('Opening video recording player...')} className="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs text-white">{t.watchRecorded}</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: AI FOR STUDY HUB */}
                  {dashboardTab === 'ai' && (
                    <div>
                      <h3 className="text-2xl font-bold text-white mb-2">AI Tools Suite for Students</h3>
                      <p className="text-xs text-white/60 mb-6">Choose from top artificial intelligence platforms optimized for research, coding, and problem solving.</p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {[
                          { name: 'ChatGPT 4o', provider: 'OpenAI', desc: 'Best for essay writing, explanations, and language translation.', icon: '🟢', url: 'https://chatgpt.com' },
                          { name: 'Claude 3.5 Sonnet', provider: 'Anthropic', desc: 'Superior for complex logic, math, and coding homework.', icon: '🟠', url: 'https://claude.ai' },
                          { name: 'Gemini 1.5 Pro', provider: 'Google AI', desc: 'Directly reads textbook PDFs, images, and YouTube videos.', icon: '🔵', url: 'https://gemini.google.com' },
                          { name: 'Perplexity AI', provider: 'Perplexity', desc: 'Real-time academic search with verified citations and sources.', icon: '🌐', url: 'https://perplexity.ai' },
                          { name: 'DeepSeek R1', provider: 'DeepSeek', desc: 'Deep reasoning model for advanced STEM and math problems.', icon: '🐋', url: 'https://deepseek.com' },
                          { name: 'Mistral AI', provider: 'Mistral', desc: 'Fast concise study summaries and flashcard generation.', icon: '⚡', url: 'https://chat.mistral.ai' }
                        ].map((ai, i) => (
                          <div key={i} className="bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col justify-between hover:border-white/25 transition-all">
                            <div>
                              <div className="flex items-center justify-between mb-3">
                                <span className="text-2xl">{ai.icon}</span>
                                <span className="text-[10px] text-white/40 uppercase font-mono">{ai.provider}</span>
                              </div>
                              <h4 className="text-base font-bold text-white">{ai.name}</h4>
                              <p className="text-xs text-white/60 mt-2 leading-relaxed">{ai.desc}</p>
                            </div>
                            <a 
                              href={ai.url} 
                              target="_blank" 
                              rel="noreferrer" 
                              className="mt-5 w-full bg-white/10 hover:bg-white/20 text-white text-xs font-semibold py-2.5 rounded-xl text-center transition-colors block"
                            >
                              Launch {ai.name} ↗
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 4: BUILT-IN NEXUM CHATBOT */}
                  {dashboardTab === 'chatbot' && (
                    <div className="h-[650px] bg-white/5 border border-white/10 rounded-3xl flex flex-col overflow-hidden">
                      <div className="p-4 border-b border-white/10 bg-black/40 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <div className="w-3 h-3 rounded-full bg-green-400"></div>
                          <span className="font-bold text-sm">Nexum AI Personal Tutor</span>
                        </div>
                        <span className="text-xs text-white/40">Powered by Nexum Study Engine</span>
                      </div>

                      <div className="flex-1 p-4 overflow-y-auto space-y-3">
                        {chatMessages.map((msg, idx) => (
                          <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-md p-3.5 rounded-2xl text-xs leading-relaxed ${
                              msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white/10 text-white/90 border border-white/10 rounded-bl-none'
                            }`}>
                              {msg.text}
                            </div>
                          </div>
                        ))}
                      </div>

                      <form onSubmit={handleSendMessage} className="p-3 border-t border-white/10 bg-black/40 flex gap-2">
                        <input 
                          type="text" 
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          placeholder={t.askAi}
                          className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-white/30"
                        />
                        <button type="submit" className="bg-white text-black text-xs font-bold px-5 py-2.5 rounded-xl hover:bg-white/90">
                          Send
                        </button>
                      </form>
                    </div>
                  )}

                  {/* TAB 5: CALENDAR & ATTENDANCE */}
                  {dashboardTab === 'calendar' && (
                    <div>
                      <h3 className="text-2xl font-bold text-white mb-2">{t.tabCalendar}</h3>
                      <p className="text-xs text-white/60 mb-6">Track your daily attendance score, live class schedule, and upcoming board exams.</p>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                          <span className="text-xs text-white/50">{t.attendanceRate}</span>
                          <div className="text-3xl font-bold text-green-400 mt-2">94.8%</div>
                          <p className="text-[10px] text-white/40 mt-1">28 / 30 Classes Attended</p>
                        </div>
                        <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                          <span className="text-xs text-white/50">{t.nextExam}</span>
                          <div className="text-3xl font-bold text-yellow-400 mt-2">14 Days</div>
                          <p className="text-[10px] text-white/40 mt-1">Final Board Assessment</p>
                        </div>
                        <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                          <span className="text-xs text-white/50">Completed Assignments</span>
                          <div className="text-3xl font-bold text-blue-400 mt-2">18 / 20</div>
                          <p className="text-[10px] text-white/40 mt-1">Top 5% of class</p>
                        </div>
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                        <h4 className="text-sm font-bold text-white mb-4">Weekly Live Class Timetable</h4>
                        <div className="space-y-3">
                          {[
                            { day: 'Monday', subject: 'Mathematics & Algebra', time: '07:00 AM - 08:30 AM', status: 'Completed' },
                            { day: 'Wednesday', subject: 'Physics & Practical Lab', time: '08:00 AM - 09:30 AM', status: 'Completed' },
                            { day: 'Friday', subject: 'Computer Science & AI', time: '05:00 PM - 06:30 PM', status: 'Scheduled' },
                            { day: 'Saturday', subject: 'Mock Exam & Doubt Solving', time: '10:00 AM - 12:00 PM', status: 'Upcoming' }
                          ].map((item, index) => (
                            <div key={index} className="flex items-center justify-between py-2 border-b border-white/5 text-xs">
                              <div>
                                <span className="font-semibold text-white">{item.day}</span> — <span className="text-white/80">{item.subject}</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <span className="text-white/50">{item.time}</span>
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  item.status === 'Completed' ? 'bg-green-500/20 text-green-400' : 'bg-blue-500/20 text-blue-400'
                                }`}>{item.status}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 6: SCOREBOARD & PROGRESS */}
                  {dashboardTab === 'scoreboard' && (
                    <div>
                      <h3 className="text-2xl font-bold text-white mb-2">{t.tabScoreboard}</h3>
                      <p className="text-xs text-white/60 mb-6">Your real-time academic rank, quiz scores, and learning streak.</p>

                      <div className="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 flex flex-wrap justify-between items-center gap-4">
                        <div>
                          <span className="text-xs text-white/50">Your Rank</span>
                          <div className="text-3xl font-extrabold text-yellow-400 mt-1">#4 in Class</div>
                        </div>
                        <div>
                          <span className="text-xs text-white/50">Study Streak</span>
                          <div className="text-3xl font-extrabold text-orange-400 mt-1">🔥 12 Days</div>
                        </div>
                        <div>
                          <span className="text-xs text-white/50">Total XP Points</span>
                          <div className="text-3xl font-extrabold text-purple-400 mt-1">4,850 XP</div>
                        </div>
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                        <h4 className="text-sm font-bold text-white mb-4">Class Leaderboard (Top Performers)</h4>
                        <div className="space-y-3">
                          {[
                            { rank: '1', name: 'Aarav Sharma', xp: '5,420 XP', badge: '🥇 Gold' },
                            { rank: '2', name: 'Priya Patel', xp: '5,100 XP', badge: '🥈 Silver' },
                            { rank: '3', name: 'Rohan Shrestha', xp: '4,980 XP', badge: '🥉 Bronze' },
                            { rank: '4', name: 'Sara Klein (You)', xp: '4,850 XP', badge: '⭐ Top 5' }
                          ].map((user, idx) => (
                            <div key={idx} className={`flex justify-between items-center p-3 rounded-xl text-xs ${
                              user.name.includes('You') ? 'bg-blue-600/30 border border-blue-500/40' : 'bg-white/5'
                            }`}>
                              <div className="flex items-center gap-3">
                                <span className="font-bold w-4 text-center">{user.rank}</span>
                                <span className="font-semibold text-white">{user.name}</span>
                              </div>
                              <div className="flex items-center gap-4">
                                <span className="text-white/60">{user.xp}</span>
                                <span className="text-[10px] bg-white/10 px-2 py-0.5 rounded">{user.badge}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                </main>
              </div>
            </div>
          )}

          {/* Auth Modal */}
          <AuthModal 
            isOpen={authModal.isOpen} 
            type={authModal.type}
            setType={(type) => setAuthModal({ ...authModal, type })}
            onClose={() => setAuthModal({ ...authModal, isOpen: false })} 
            onAuthSuccess={handleAuthSuccess}
            t={t}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
