                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 7: LEARNING HISTORY & ACTIVITY LOG */}
                  {dashboardTab === 'history' && (
                    <div>
                      <div className="flex items-center justify-between mb-6">
                        <div>
                          <h3 className="text-2xl font-bold text-white">{t.historyTitle}</h3>
                          <p className="text-xs text-white/60 mt-1">Track every video watched, PDF downloaded, AI question asked, and custom resource created.</p>
                        </div>
                        <button 
                          onClick={() => setHistoryLogs([])}
                          className="text-xs text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-full transition-colors"
                        >
                          Clear History Log
                        </button>
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-2xl p-5">
                        {historyLogs.length === 0 ? (
                          <div className="text-center py-12 text-white/40 text-xs">
                            No study activities logged yet. Explore courses or ask AI to start tracking!
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {historyLogs.map((log) => (
                              <div key={log.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white/5 border border-white/5 rounded-xl gap-2 hover:border-white/15 transition-all">
                                <div className="flex items-start gap-3">
                                  <span className={`text-xs px-2.5 py-1 rounded-md font-bold uppercase mt-0.5 ${
                                    log.type === 'Class' ? 'bg-red-500/20 text-red-400' :
                                    log.type === 'Download' ? 'bg-green-500/20 text-green-400' :
                                    log.type === 'AI Query' ? 'bg-purple-500/20 text-purple-400' :
                                    'bg-blue-500/20 text-blue-400'
                                  }`}>
                                    {log.type}
                                  </span>
                                  <div>
                                    <h4 className="text-sm font-semibold text-white">{log.title}</h4>
                                    <p className="text-xs text-white/50 mt-0.5">{log.details}</p>
                                  </div>
                                </div>
                                <span className="text-[11px] text-white/40 font-mono self-end sm:self-auto">{log.timestamp}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                </main>
              </div>
            </div>
          )}

          {/* ================= MODAL: ADD CUSTOM SOURCE / MATERIAL ================= */}
          {isAddSourceModalOpen && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center px-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsAddSourceModalOpen(false)} />
              <div className="relative w-full max-w-lg bg-[#0E0E0E] border border-white/15 rounded-3xl p-6 shadow-2xl z-10">
                <button onClick={() => setIsAddSourceModalOpen(false)} className="absolute top-5 right-5 text-white/50 hover:text-white">
                  <XIcon />
                </button>

                <h3 className="text-xl font-bold text-white mb-1">Add New Learning Source</h3>
                <p className="text-xs text-white/60 mb-6">Attach a custom PDF link, website, notebook source, or textbook code to your current track.</p>

                <form onSubmit={handleAddSourceSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs text-white/70 font-medium mb-1.5">Resource / Subject Name</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Quantum Computing Fundamentals" 
                      value={newSource.name}
                      onChange={(e) => setNewSource({ ...newSource, name: e.target.value })}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/30"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-white/70 font-medium mb-1.5">Source Code / Tag</label>
                      <input 
                        type="text" 
                        placeholder="e.g. CS-909" 
                        value={newSource.code}
                        onChange={(e) => setNewSource({ ...newSource, code: e.target.value })}
                        className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/30"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-white/70 font-medium mb-1.5">Material Type</label>
                      <select 
                        value={newSource.type}
                        onChange={(e) => setNewSource({ ...newSource, type: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none"
                      >
                        <option value="PDF">PDF Notes</option>
                        <option value="Link">Website Link</option>
                        <option value="Book">Textbook</option>
                        <option value="Code">Source Code</option>
                        <option value="Exam">Practice Exam</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-white/70 font-medium mb-1.5">Notes / URL / Description</label>
                    <textarea 
                      rows="3"
                      placeholder="Enter Drive URL, textbook chapter numbers, or specific instructions..."
                      value={newSource.notes}
                      onChange={(e) => setNewSource({ ...newSource, notes: e.target.value })}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/30"
                    ></textarea>
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30"
                  >
                    + Save Source to Course Grid
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODAL: ADD CALENDAR EVENT ================= */}
          {isAddEventModalOpen && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center px-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsAddEventModalOpen(false)} />
              <div className="relative w-full max-w-md bg-[#0E0E0E] border border-white/15 rounded-3xl p-6 shadow-2xl z-10">
                <button onClick={() => setIsAddEventModalOpen(false)} className="absolute top-5 right-5 text-white/50 hover:text-white">
                  <XIcon />
                </button>

                <h3 className="text-xl font-bold text-white mb-1">Add Event for Oct {selectedCalDay}, 2026</h3>
                <p className="text-xs text-white/60 mb-6">Schedule a reminder, board exam date, or group study session.</p>

                <form onSubmit={handleAddEventSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs text-white/70 font-medium mb-1.5">Event Title</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Physics Chapter 3 Quiz" 
                      value={newEventTitle}
                      onChange={(e) => setNewEventTitle(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/30"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-white/70 font-medium mb-1.5">Time</label>
                      <input 
                        type="text" 
                        value={newEventTime}
                        onChange={(e) => setNewEventTime(e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-white/70 font-medium mb-1.5">Event Type</label>
                      <select 
                        value={newEventType}
                        onChange={(e) => setNewEventType(e.target.value)}
                        className="w-full bg-[#1A1A1A] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none"
                      >
                        <option value="class">Live Class</option>
                        <option value="exam">Board Exam</option>
                        <option value="assignment">Assignment</option>
                        <option value="revision">Self Revision</option>
                      </select>
                    </div>
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30"
                  >
                    Save Event to Calendar
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODAL: YOUTUBE THEATER PLAYER ================= */}
          {selectedYtVideo && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/90 backdrop-blur-xl" onClick={() => setSelectedYtVideo(null)} />
              <div className="relative w-full max-w-4xl bg-[#080808] border border-white/15 rounded-3xl overflow-hidden shadow-2xl z-10 flex flex-col">
                <div className="p-4 bg-black/60 border-b border-white/10 flex justify-between items-center">
                  <div>
                    <h4 className="text-sm font-bold text-white">{selectedYtVideo.title}</h4>
                    <span className="text-xs text-white/50">{selectedYtVideo.channel} • {selectedYtVideo.duration}</span>
                  </div>
                  <button onClick={() => setSelectedYtVideo(null)} className="text-white/50 hover:text-white p-1">
                    <XIcon />
                  </button>
                </div>

                <div className="aspect-video w-full bg-black">
                  <iframe 
                    src={`https://www.youtube-nocookie.com/embed/${selectedYtVideo.ytId}?autoplay=1`}
                    title={selectedYtVideo.title}
                    className="w-full h-full border-none"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                </div>
              </div>
            </div>
          )}

          {/* Auth Modal */}
          <AuthModal 
            isOpen={authModal.isOpen} 
            type={authModal.type}
            setType={(type) => setAuthModal({ ...authModal, type })}
            onClose={() => setAuthModal({ ...authModal, isOpen: false })} 
            onAuthSuccess={handleAuthSuccess}
            t={t}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
